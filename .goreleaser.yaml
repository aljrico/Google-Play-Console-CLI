# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: playpub

builds:
  - id: playpub
    main: .
    binary: playpub
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/aljrico/Google-Play-Console-CLI/cmd.version={{ .Version }}
      - -X github.com/aljrico/Google-Play-Console-CLI/cmd.commit={{ .Commit }}
      - -X github.com/aljrico/Google-Play-Console-CLI/cmd.date={{ .CommitDate }}

archives:
  - id: playpub
    ids:
      - playpub
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: aljrico
    name: Google-Play-Console-CLI

brews:
  - name: playpub
    ids:
      - playpub
    repository:
      owner: aljrico
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/aljrico/Google-Play-Console-CLI
    description: Go CLI for Google Play Developer API workflows
    license: MIT
    test: |
      system "#{bin}/playpub", "version"
