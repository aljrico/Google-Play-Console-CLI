# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gpc

before:
  hooks:
    - go mod tidy

builds:
  - id: gpc
    main: .
    binary: gpc
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/aljrico/Google-Play-Console-CLI/cmd.version={{ .Version }}
      - -X github.com/aljrico/Google-Play-Console-CLI/cmd.commit={{ .Commit }}
      - -X github.com/aljrico/Google-Play-Console-CLI/cmd.date={{ .CommitDate }}

archives:
  - id: gpc
    ids:
      - gpc
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: aljrico
    name: Google-Play-Console-CLI

homebrew_casks:
  - name: gpc
    ids:
      - gpc
    repository:
      owner: aljrico
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/aljrico/Google-Play-Console-CLI
    description: Fast, scriptable CLI for the Google Play Developer API
    license: MIT
    binaries:
      - gpc
    generate_completions_from_executable:
      executable: bin/gpc
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
        - pwsh
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gpc"], must_succeed: false
          end
